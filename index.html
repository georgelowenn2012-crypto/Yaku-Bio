<!DOCTYPE html>
<html>
<head>
    <title>Yaku-Bio MVP</title>
    <script src="https://cdn.jsdelivr.net/npm/@roboflow/roboflow.js"></script>
</head>
<body>
    <video id="videoElement" width="640" height="640" autoplay></video>
    <canvas id="canvasElement" width="640" height="640" style="position:absolute; left:8px; top:8px;"></canvas>

    <script>
        const video = document.getElementById("videoElement");
        const canvas = document.getElementById("canvasElement");
        const ctx = canvas.getContext("2d");

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
            });

        roboflow.auth({
            publishable_key: "5DlygMkBR6rig5qS1XVz"
        }).load({
            model: "yaku-bio-larvas",
            version: "1"
        }).then(model => {
            setInterval(() => {
                model.detect(video).then(predictions => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    predictions.forEach(prediction => {
                        ctx.strokeStyle = "#00FF00";
                        ctx.lineWidth = 4;
                        ctx.strokeRect(prediction.bbox.x - prediction.bbox.width / 2, prediction.bbox.y - prediction.bbox.height / 2, prediction.bbox.width, prediction.bbox.height);
                        ctx.fillStyle = "#00FF00";
                        ctx.font = "18px Arial";
                        ctx.fillText("Larva detectada", prediction.bbox.x - prediction.bbox.width / 2, prediction.bbox.y - prediction.bbox.height / 2 - 5);
                    });
                });
            }, 500);
        });
    </script>
</body>
</html>
